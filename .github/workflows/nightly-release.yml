name: Nightly Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., nightly-YYYY-MM-DD)"
        required: false
        default: "auto"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"
          cache: "maven"

      - name: Build with Maven
        run: mvn --batch-mode compile assembly:single -Dmaven.test.skip=true

      - name: Prepare Docker artifact
        run: |
          JAR_PATH="$(ls -1 target/tabula-*-jar-with-dependencies.jar | head -n 1)"
          cp "$JAR_PATH" target/tabula.jar

      - name: Generate release date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set release version
        id: release_version
        run: |
          if [ "${{ github.event.inputs.version }}" == "auto" ]; then
            echo "version=nightly-${{ steps.date.outputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_version.outputs.version }}
          name: Nightly Release ${{ steps.release_version.outputs.version }}
          body: |
            Nightly build generated on ${{ steps.date.outputs.date }}

            This is an automated nightly build of the latest code.
          draft: false
          prerelease: true
          files: |
            target/tabula-*-jar-with-dependencies.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image_name
        run: echo "value=ghcr.io/elohmeier/tabula-java" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.value }}
          tags: |
            type=raw,value=${{ steps.release_version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            TABULA_JAR=target/tabula.jar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
