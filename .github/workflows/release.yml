name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semantic.outputs.released || 'false' }}
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ steps.semantic.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Ensure workflow SHA is released
        run: git reset --hard ${{ github.sha }}

      - name: Semantic release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          directory: python
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          build: "false"

  build-wheels:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cibw_archs_linux: x86_64
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - os: windows-latest
            runner: windows-latest
          - os: macos-14
            runner: macos-14

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build tabula fat jar
        shell: bash
        run: mvn --batch-mode compile assembly:single -Dmaven.test.skip=true -Drevision=${{ needs.release.outputs.version }}

      - name: Stage tabula jar for wheel builds
        shell: bash
        run: |
          JAR_PATH="$(ls -1 target/tabula-*-jar-with-dependencies.jar | head -n 1)"
          cp "$JAR_PATH" python/tabula.jar

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
          CIBW_SKIP: "*-musllinux* *-win32"
          CIBW_BEFORE_BUILD: "python {package}/scripts/prepare_bundle.py"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_TEST_COMMAND: "tabula-java --version"
        with:
          package-dir: python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-pypi:
    needs: [release, build-wheels]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven

      - name: Build release jar for container image
        run: |
          mvn --batch-mode compile assembly:single -Dmaven.test.skip=true -Drevision=${{ needs.release.outputs.version }}
          JAR_PATH="$(ls -1 target/tabula-*-jar-with-dependencies.jar | head -n 1)"
          cp "$JAR_PATH" target/tabula.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            TABULA_JAR=target/tabula.jar
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
