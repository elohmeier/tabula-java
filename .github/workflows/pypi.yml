name: PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "py-v*"

jobs:
  build-wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            cibw_archs_linux: x86_64
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - os: windows-latest
            runner: windows-latest
          - os: macos-14
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Build tabula fat jar
        shell: bash
        run: mvn --batch-mode compile assembly:single -Dmaven.test.skip=true

      - name: Stage tabula jar for wheel builds
        shell: bash
        run: |
          JAR_PATH="$(ls -1 target/tabula-*-jar-with-dependencies.jar | head -n 1)"
          cp "$JAR_PATH" python/tabula.jar

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
          CIBW_SKIP: "*-musllinux* *-win32"
          CIBW_BEFORE_BUILD: "python {package}/scripts/prepare_bundle.py"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_TEST_COMMAND: "tabula-java --version"
        with:
          package-dir: python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-pypi:
    needs: [build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
