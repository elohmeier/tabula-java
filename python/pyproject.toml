[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tabula-java"
version = "0.1.0"
description = "Python wrapper that ships tabula-java with a bundled JRE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tabula" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Text Processing",
]

[project.scripts]
tabula-java = "tabula_java_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_java_runtime"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tabula_java_runtime",
  "scripts/prepare_bundle.py",
  "README.md",
]

[tool.hatch.build]
include = ["src/tabula_java_runtime/runtime/**/*"]
